[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diskstack"
version = "1.0.0"
description = "Merge several dumps of one floppy disk into the best possible image, and say what is still missing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "diskstack/_vendor/greaseweazle/COPYING"]
authors = [{ name = "Christian Bosch", email = "cbosch101@gmail.com" }]
keywords = [
    "floppy", "flux", "greaseweazle", "supercard-pro", "scp", "preservation",
    "disk-image", "data-recovery", "retrocomputing", "amiga", "mfm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "click>=8.1",
    "bitarray>=2.9",
    "crcmod>=1.7",
]

[project.urls]
Homepage = "https://github.com/cbosch101/diskstack"
Repository = "https://github.com/cbosch101/diskstack"
Issues = "https://github.com/cbosch101/diskstack/issues"
Changelog = "https://github.com/cbosch101/diskstack/blob/main/CHANGELOG.md"

[project.scripts]
diskstack = "diskstack.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["diskstack*"]

[tool.setuptools.package-data]
"diskstack._vendor.greaseweazle" = ["COPYING"]
"diskstack._vendor.greaseweazle.data" = ["*.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
